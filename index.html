<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malipula Suits | Connect With Us</title>
<meta name="description" content="Made-to-measure suits, kaftans and accessories, tailored by hand and shipped wherever you are.">
<meta name="theme-color" content="#16213E">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta property="og:type" content="website">
<meta property="og:title" content="Malipula Suits | Connect With Us">
<meta property="og:description" content="Made-to-measure suits, kaftans and accessories, tailored by hand.">
<meta property="og:image" content="https://malipula.co.tz/uploads/hero-street-1.jpg">
<link rel="apple-touch-icon" href="https://malipula.co.tz/uploads/logo.png">
<link rel="icon" href="https://malipula.co.tz/uploads/logo.png">
<style>
  /* Brand navy taken from malipula.co.tz theme colour */
  :root{--navy:#16213E;--navy-deep:#0E1629;--paper:#F6F3EC;--accent:#F6F3EC}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--navy-deep)}
  body{
    min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;
    -webkit-tap-highlight-color:transparent;
    font-family:"Helvetica Neue",Arial,sans-serif;color:var(--paper);
    background:radial-gradient(circle at 50% 0%,#22325C 0%,var(--navy) 45%,var(--navy-deep) 100%);
    padding:calc(env(safe-area-inset-top,0px) + 36px) 22px calc(env(safe-area-inset-bottom,0px) + 32px);
  }
  main{width:100%;max-width:440px;margin:0 auto;text-align:center}
  /* Logo sits directly on the page background: no box, fill or shadow */
  .logo-wrap{
    background:none;border-radius:0;padding:0;margin:0 auto 26px;box-shadow:none;
    display:inline-flex;align-items:center;justify-content:center;min-width:150px;min-height:84px;
  }
  .logo-wrap img{display:block;max-width:190px;max-height:80px;height:auto;width:auto;background:none}
  .logo-wrap b{color:var(--paper);font-family:Georgia,serif;font-size:1.5rem;letter-spacing:.12em;text-transform:uppercase}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:1.9rem;letter-spacing:.04em}
  h1 em{font-style:italic}
  .sub{margin:12px auto 32px;font-size:.92rem;line-height:1.55;color:rgba(246,243,236,.75);max-width:32ch}
  .links{list-style:none}
  .links li{margin-bottom:14px}
  .link{
    display:flex;align-items:center;text-decoration:none;-webkit-appearance:none;
    padding:16px 20px;border-radius:14px;background:var(--accent);color:var(--navy);
    font-weight:600;letter-spacing:.04em;font-size:1rem;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .link svg{width:22px;height:22px;fill:currentColor;flex:0 0 22px;margin-right:14px}
  .link .t{flex:1;min-width:0;text-align:left}
  .link small{display:block;font-weight:400;font-size:.76rem;opacity:.7;margin-top:2px;letter-spacing:.02em}
  .link:hover,.link:focus-visible{transform:translateY(-3px);box-shadow:0 14px 26px rgba(0,0,0,.35);outline:none}
  .link:active{transform:scale(.98)}
  footer{margin-top:34px;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(246,243,236,.5)}
  @media (max-width:360px){h1{font-size:1.6rem}.link{padding:14px 16px;font-size:.95rem}}
  @media (min-width:900px){h1{font-size:2.2rem}.link{padding:18px 24px}}
  @media (prefers-reduced-motion:reduce){.link{transition:none}}
</style>
</head>
<body>
<main>
  <div class="logo-wrap">
    <img src="https://malipula.co.tz/uploads/logo.png" alt="Malipula Suits"
         onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'Malipula'}))">
  </div>
  <h1>Wear your <em>presence.</em></h1>
  <p class="sub">Made-to-measure suits, kaftans and accessories, tailored by hand.</p>

      <span class="t">Instagram<small>@malipula_suits</small></span><span>&rarr;</span></a></li>

    <li><a class="link" href="https://wa.me/255754023335?text=Hello%20Malipula%2C" target="_blank" rel="noopener">

  <footer>&copy; <span id="y">2026</span> Malipula</footer>
</main>
<script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
